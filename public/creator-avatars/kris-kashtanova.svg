<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Kris Kashtanova Editorial Avatar">
  <defs>
    <linearGradient id="kkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26200a"/>
      <stop offset="50%" stop-color="#141105"/>
      <stop offset="100%" stop-color="#080602"/>
    </linearGradient>
    <radialGradient id="kkGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#kkGrad)"/>
  <circle cx="100" cy="100" r="99" fill="url(#kkGlow)"/>
  
  <!-- Generative Neural Constellation Nodes -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#855a14" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="50" cy="90" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="150" cy="90" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="100" cy="46" r="3" fill="#f59e0b" opacity="0.6"/>
  <line x1="50" y1="90" x2="100" y2="46" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="150" y1="90" x2="100" y2="46" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Monogram -->
  <text x="100" y="116" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">KK</text>
  
  <!-- Subtitle Pill -->
  <rect x="44" y="138" width="112" height="20" rx="10" fill="#26200a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
  <text x="100" y="152" font-family="'Inter', monospace, sans-serif" font-weight="700" font-size="8.5" fill="#f59e0b" text-anchor="middle" letter-spacing="1.2">AI GRAPHICS</text>
</svg>
