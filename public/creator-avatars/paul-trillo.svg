<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Paul Trillo Editorial Avatar">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c231f"/>
      <stop offset="50%" stop-color="#061311"/>
      <stop offset="100%" stop-color="#020807"/>
    </linearGradient>
    <radialGradient id="ptGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BFE774" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#BFE774" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#ptGrad)"/>
  <circle cx="100" cy="100" r="99" fill="url(#ptGlow)"/>
  
  <!-- Cinema Frame Guides -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#BFE774" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#394137" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="100" y1="8" x2="100" y2="24" stroke="#BFE774" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="100" y1="176" x2="100" y2="192" stroke="#BFE774" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="8" y1="100" x2="24" y2="100" stroke="#BFE774" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="176" y1="100" x2="192" y2="100" stroke="#BFE774" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Monogram -->
  <text x="100" y="116" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="52" fill="#F0EFE9" text-anchor="middle" letter-spacing="-1">PT</text>
  
  <!-- Technical Subtitle Pill -->
  <rect x="55" y="138" width="90" height="20" rx="10" fill="#0c231f" stroke="#BFE774" stroke-width="1" stroke-opacity="0.5"/>
  <text x="100" y="152" font-family="'Inter', monospace, sans-serif" font-weight="700" font-size="9" fill="#BFE774" text-anchor="middle" letter-spacing="1.5">AI DIRECTOR</text>
</svg>
