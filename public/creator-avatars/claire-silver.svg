<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Claire Silver Editorial Avatar">
  <defs>
    <linearGradient id="csGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="50%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#080807"/>
    </linearGradient>
    <radialGradient id="csGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e2ad6c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e2ad6c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#csGrad)"/>
  <circle cx="100" cy="100" r="99" fill="url(#csGlow)"/>
  
  <!-- Digital Haute Couture Gold Foil Double Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#e2ad6c" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#8c6a38" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#e2ad6c" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Monogram -->
  <text x="100" y="117" font-family="'Georgia', serif, -apple-system" font-style="italic" font-weight="700" font-size="52" fill="#FDFBF7" text-anchor="middle" letter-spacing="1">CS</text>
  
  <!-- Subtitle Pill -->
  <rect x="45" y="138" width="110" height="20" rx="10" fill="#242220" stroke="#e2ad6c" stroke-width="1" stroke-opacity="0.6"/>
  <text x="100" y="152" font-family="'Inter', monospace, sans-serif" font-weight="700" font-size="8.5" fill="#e2ad6c" text-anchor="middle" letter-spacing="1.5">HAUTE COUTURE</text>
</svg>
